name: Push to Replicate

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: 'Model name (e.g., usajosefernan-cmd/luxcalerdotcom)'
        required: false
        default: 'usajosefernan-cmd/luxcalerdotcom'
  push:
    branches:
      - main
    paths:
      - 'predict.py'
      - 'cog.yaml'

jobs:
  push_to_replicate:
      
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h
    name: Push to Replicate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Cog
        uses: replicate/setup-cog@v2
        with:
          token: ${{ secrets.REPLICATE_API_TOKEN }}
      
      - name: Push to Replicate
        run: |
          cog push r8.im/${{ github.event.inputs.model_name || 'usajosefernan-cmd/luxcalerdotcom' }}
